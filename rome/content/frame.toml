# The finding in three words. Rendered as the closing summary.

[[regimes]]
key = "property"
from = 1
to = 5
word = "Property"
colour = "var(--b-months)"
ask = "Whose are you?"
line = "A city of hundreds of thousands, possibly a million, and a large part of its labour force is owned. A man who cannot name his people is not read as a free stranger. He is read as missing property."

[[regimes]]
key = "pilgrim"
from = 6
to = 15
word = "Pilgrim"
colour = "var(--b-lifetime)"
ask = "Are you hungry?"
line = "The city falls to as few as fifteen thousand people, with cattle in the Forum and farmland inside the walls, and it industrialises hospitality to strangers. A man arriving on foot with nothing is not an anomaly. He is the main import."

[[regimes]]
key = "papers"
from = 16
to = 20
word = "Papers"
colour = "var(--b-months)"
ask = "Who are you?"
line = "The register replaces the hospice. Parish census, health pass, passport, anagrafe, identity card. Every earlier Rome had somewhere to put an unexplained man, even if it was a slave market. This one has nowhere."

